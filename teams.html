<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teams — Microsoft Learn Student Chapter</title>
  <meta name="description" content="Meet the creators, builders, and leads behind the Microsoft Learn Student Chapter.">
  <!-- Resource Hints for Fast Rendering -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/teams.css?v=14.0">
  <!-- GSAP & ScrollTrigger for high-performance buttery scroll & animation syncing -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

  <!-- Lenis Smooth Scroll (Parity with Home page) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.css">
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
</head>

<body>

  <!-- Pinned Glassmorphism Navbar (Matches Home & Achievements) -->
  <header class="glass-navbar navbar-fixed" id="glass-navbar" aria-label="Main Navigation">
    <nav class="glass-nav-container">
      <a href="index.html#hero" class="glass-nav-brand" aria-label="MLSC Home">
        <svg class="mlsc-logo-icon nav-logo-icon" width="28" height="18" viewBox="0 0 43 28" fill="none"
          xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- Top row: col 2 (Orange), col 3 (Green) -->
          <rect x="15" y="0" width="13" height="13" rx="1.5" fill="#F25022" class="mlsc-sq mlsc-sq-orange" />
          <rect x="30" y="0" width="13" height="13" rx="1.5" fill="#7FBA00" class="mlsc-sq mlsc-sq-green" />
          <!-- Bottom row: col 1 (Blue), col 2 (Yellow) -->
          <rect x="0" y="15" width="13" height="13" rx="1.5" fill="#00A4EF" class="mlsc-sq mlsc-sq-blue" />
          <rect x="15" y="15" width="13" height="13" rx="1.5" fill="#FFB900" class="mlsc-sq mlsc-sq-yellow" />
        </svg>
        <span class="nav-brand-text"><span class="letter-m">M</span><span class="letter-l">L</span><span
            class="letter-s">S</span><span class="letter-c">C</span></span>
      </a>
      <div class="glass-nav-links">
        <a href="index.html#hero" class="glass-nav-link">Home</a>
        <a href="events.html" class="glass-nav-link">Events</a>
        <a href="teams.html" class="glass-nav-link active">Teams</a>
        <a href="achievements.html" class="glass-nav-link">Achievements</a>
        <a href="games.html" class="glass-nav-link">Games</a>
      </div>
    </nav>
  </header>

  <!-- Main Website Content -->
  <main class="site-content" style="padding: 0; min-height: 100vh;">

    <!-- ========================================================= -->
    <!-- SECTION: MLSC TEAMS & MEMBERS                            -->
    <!-- ========================================================= -->
    <section id="teams" class="teams-section" aria-label="MLSC Core Team Members">

      <!-- Hero / Header Viewport Section (100vh Full Viewport) -->
      <section class="teams-hero-viewport" id="teams-hero" aria-label="Meet The Team Hero">
        <div class="teams-header">
          <div class="teams-tag">
            <span>Core Community</span>
          </div>
          <h1 class="teams-title">Meet the <span class="title-gradient">Minds Behind MLSC</span></h1>
          <p class="teams-desc">
            Different roles &nbsp;•&nbsp; Same vision &nbsp;•&nbsp; One club
          </p>

          <!-- Tenure / Year Selector Switch -->
          <div class="teams-tenure-switch-wrapper">
            <div class="teams-tenure-switch" id="teams-tenure-switch" role="tablist" aria-label="Year Selector">
              <button class="teams-tenure-btn active" data-tenure="Current Year (2025–26)" role="tab" aria-selected="true">
                <span>Current Year (2025–26)</span>
              </button>
              <button class="teams-tenure-btn" data-tenure="2024–25" role="tab" aria-selected="false">
                <span>2024–25</span>
              </button>
              <button class="teams-tenure-btn" data-tenure="2023–24" role="tab" aria-selected="false">
                <span>2023–24</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Stacked Teams Sections Wrapper (Dynamically Populated by teams.js) -->
      <div class="teams-sections-wrapper" id="teams-sections-wrapper">
        <div class="teams-loading-state" id="teams-loading-state"
          style="text-align: center; padding: 60px 20px; color: #38bdf8; font-family: 'Plus Jakarta Sans', sans-serif;">
          <div class="loading-spinner"
            style="display: inline-block; width: 32px; height: 32px; border: 3px solid rgba(56, 189, 248, 0.2); border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;">
          </div>
          <p style="margin: 0; font-size: 0.95rem; letter-spacing: 0.05em;">Loading team members...</p>
        </div>
      </div>

    </section>

    <!-- SECTION 4: FOOTER (Matches Home Tab) -->
    <footer class="site-footer" id="footer" aria-label="Site Footer"></footer>

  </main>

  <!-- Script for Teams Section -->
  <script src="js/footer.js"></script>
  <script src="js/teams.js?v=14.0"></script>
  <script src="js/script.js"></script>
</body>

</html>
