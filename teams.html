  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/teams.css?v=4.2">
  <!-- Lenis Smooth Scroll (Parity with Home page) -->

</head>

<body>

  <!-- Floating Top-Left Hamburger (Same as Home tab, visible on Teams page) -->

    <span class="hamburger-line"></span>
    <span class="hamburger-line"></span>
    <span class="hamburger-line"></span>
  </button>

  <!-- Left Sidebar Drawer & Backdrop (Identical to Home tab) -->

  <aside class="sidebar-drawer" id="sidebar-drawer" aria-label="Navigation Menu">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <span class="brand-dot"></span>
        <span class="sidebar-brand-title"><span class="letter-m">M</span><span class="letter-l">L</span><span
            class="letter-s">S</span><span class="letter-c">C</span></span>
      </div>
      <button class="sidebar-close" id="sidebar-close" aria-label="Close menu">&times;</button>
    </div>

    <nav class="sidebar-nav">
      <a href="index.html#hero" class="sidebar-link">
        <span class="link-index">01</span>
        <span class="link-label">Home</span>
      </a>
      <a href="teams.html" class="sidebar-link active">
        <span class="link-index">02</span>
        <span class="link-label">Team</span>
      </a>
      <a href="events.html" class="sidebar-link">
        <span class="link-index">03</span>
        <span class="link-label">Events</span>
      </a>
      <a href="games.html" class="sidebar-link">
        <span class="link-index">04</span>
        <span class="link-label">Games</span>
      </a>
      <a href="contact.html" class="sidebar-link">
        <span class="link-index">05</span>
        <span class="link-label">Contact us</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <p class="sidebar-note">Microsoft Learn Student Chapter</p>
      <div class="sidebar-social-links">
        <a href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="https://discord.com" target="_blank" rel="noopener noreferrer">Discord</a>
      </div>
    </div>
  </aside>

  <!-- Main Website Content -->
  <main class="site-content" style="padding: 0; min-height: 100vh;">

    <!-- ========================================================= -->
    <!-- SECTION: MLSC TEAMS & MEMBERS (3D Coverflow Carousel)     -->
    <!-- ========================================================= -->
    <section id="teams" class="teams-section" aria-label="MLSC Core Team Members">

      <!-- Ambient Background Video Layer (Seamless Forward-and-Reverse Ping-Pong Loop) -->
      <div class="teams-bg-decor" aria-hidden="true">
        <video id="teams-bg-video" class="teams-bg-video active" autoplay muted loop playsinline preload="auto">
          <source src="assets/videos/teams_pingpong.mp4" type="video/mp4">
        </video>
        <div class="teams-bg-overlay"></div>
        <div class="teams-grid-texture"></div>
      </div>

      <!-- Section Header -->
      <div class="teams-header">
        <div class="teams-tag">
          <span class="teams-tag-dot"></span>
          <span>02 // CORE COMMUNITY</span>
        </div>
        <h1 class="teams-title">Meet the <span class="title-gradient">Minds Behind MLSC</span></h1>
        <p class="teams-desc">
          Different roles &nbsp;•&nbsp; Same vision &nbsp;•&nbsp; One club
        </p>
      </div>

      <!-- Sticky / Quick Jump Domain Navigation Bar -->
      <nav class="teams-jump-nav" id="teams-jump-nav" aria-label="Quick jump to domain">
        <div class="teams-jump-container" id="teams-jump-container"></div>
      </nav>

      <!-- Stacked Teams Sections Wrapper (Dynamically Populated by teams.js) -->
      <div class="teams-sections-wrapper" id="teams-sections-wrapper"></div>

    </section>

    <!-- SECTION 4: FOOTER (Matches Home Tab) -->
    <footer class="site-footer" id="footer" aria-label="Site Footer"></footer>

  </main>

  <!-- Script for Teams Section -->
  <script src="js/footer.js"></script>
  <script src="js/teams.js?v=5.1"></script>
