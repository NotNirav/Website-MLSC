<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 215" width="280" height="215">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="280" height="215" fill="url(#bgGrad)" />
  <circle cx="140" cy="95" r="48" fill="rgba(6, 182, 212, 0.12)" filter="url(#glow)" />
  <circle cx="140" cy="95" r="42" fill="url(#circleGrad)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />
  <text x="140" y="103" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">AP</text>
  <text x="140" y="162" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">Akshay Pote</text>
  <text x="140" y="180" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">Sponsorship</text>
</svg>
