      <stop offset="0%" stop-color="#0e131f" />
      <stop offset="50%" stop-color="#141a29" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="circleGradGD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
